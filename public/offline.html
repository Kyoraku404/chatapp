<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#D92D20" />
  <title>RUSH is offline</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; background: #faf8f5; color: #131022; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 340px; text-align: center; }
    .mark { display: grid; width: 72px; height: 72px; margin: 0 auto 24px; place-items: center; border-radius: 22px; background: #d92d20; color: white; }
    h1 { margin: 0; font-size: 27px; letter-spacing: -.04em; }
    p { color: #6b5e89; line-height: 1.5; }
    button { border: 0; border-radius: 13px; background: #d92d20; color: white; padding: 13px 24px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg width="39" height="39" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2Z" /></svg></div>
    <h1>You’re offline</h1>
    <p>Reconnect to see your latest RUSH conversations and make calls. Private messages are never saved to this offline screen.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
